aid: eos-ai
name: Eos AI
description: >-
  Eos AI is a San Francisco healthcare technology company building an autonomous operating system for
  healthcare that helps clinics and hospitals identify eligible patients and enable early care
  interventions. The platform connects to fragmented clinical systems (EHRs, imaging archives, labs,
  scheduling, and billing), resolves patient identities across sites and encounters, and links records
  into a continuous longitudinal history that can be searched and analyzed as one distributed database.
  Two harmonization products anchor the stack: VERA standardizes medical imaging across scanners, sites,
  and protocols to improve model performance and shorten deployment, and LUCIA structures EHR free text,
  ICD, SNOMED, and clinical signals into a unified representation for downstream analytics. On top of the
  harmonized data, Eos runs predictive models over full patient trajectories and drives automations into
  hospital workflows, reporting roughly 3x administrative productivity and 37% revenue recovery in early
  deployments. Founded in 2025 by Arya Khokhar and backed by Y Combinator (Winter 2026 batch). Its
  application is gated at my.helloeos.ai; no public developer API, OpenAPI, or developer portal has been
  published to date, so this profile captures the company identity and the security posture of its public
  web surface.
